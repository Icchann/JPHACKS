name: Mobile Build (iOS & Android)

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "frontend/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS Build (macOS Cloud Runner)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Prepare mobile assets and sync Capacitor iOS
        run: |
          npm --prefix frontend run prepare:mobile
          cd frontend && npx cap sync ios
      - name: Build iOS App with Xcode (Code Sign Not Required)
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj -scheme App -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO clean build

  build-android:
    name: Android Build (Debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Prepare mobile assets and sync Capacitor Android
        run: |
          npm --prefix frontend run prepare:mobile
          cd frontend && npx cap sync android
      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sanmou-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
